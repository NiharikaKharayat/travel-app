<!DOCTYPE html>
<html class="light" lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Ferene · Group Chat</title>


  <!-- =====================================================
       TAILWIND
  ====================================================== -->

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="tailwind.config.js"></script>


  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />


  <!-- =====================================================
       MATERIAL SYMBOLS
  ====================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet"
  />


  <!-- =====================================================
       MAIN CSS
  ====================================================== -->

  <link
    href="style.css"
    rel="stylesheet"
  />


  <!-- =====================================================
       SOCKET.IO
  ====================================================== -->

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


  <!-- =====================================================
       CHAT STYLES
  ====================================================== -->

  <style>

    /* =====================================================
       PAGE
    ====================================================== */

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }


    body {
      min-height: 100vh;
    }


    /* =====================================================
       CHAT AREA
    ===================================================== */

    #chatMessages {

      width: 100%;
      max-width: 700px;

      margin-left: auto;
      margin-right: auto;

      box-sizing: border-box;

      display: flex;
      flex-direction: column;

      overflow-y: auto;

      padding: 24px 16px;
    }


    /* =====================================================
       MESSAGE ROW
    ===================================================== */

    .chat-message-row {

      width: 100%;

      display: flex;

      flex-shrink: 0;

      margin-bottom: 12px;

      box-sizing: border-box;
    }


    /* =====================================================
       OTHER TRAVELER
       LEFT SIDE
    ===================================================== */

    .chat-message-row.received {

      justify-content: flex-start;
    }


    .chat-message-row.received .chat-bubble {

      background: #ffffff;

      color: #1e293b;

      border: 1px solid #dbe7e8;

      border-radius:
        18px
        18px
        18px
        5px;

      box-shadow:
        0 3px 12px rgba(7, 28, 54, 0.06);
    }


    .chat-message-row.received .chat-sender-name {

      color: #0f766e;
    }


    /* =====================================================
       YOUR MESSAGE
       RIGHT SIDE
    ===================================================== */

    .chat-message-row.sent {

      justify-content: flex-end;
    }


    .chat-message-row.sent .chat-bubble {

      background:
        linear-gradient(
          135deg,
          #14b8a6,
          #0891b2
        );

      color: #ffffff;

      border: none;

      border-radius:
        18px
        18px
        5px
        18px;

      box-shadow:
        0 3px 12px rgba(7, 28, 54, 0.12);
    }


    .chat-message-row.sent .chat-sender-name {

      color:
        rgba(255, 255, 255, 0.85);
    }


    /* =====================================================
       MESSAGE BUBBLE
    ===================================================== */

    .chat-bubble {

      width: fit-content;

      max-width: min(75%, 420px);

      padding: 10px 15px;

      box-sizing: border-box;

      word-break: break-word;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       SENDER NAME
    ===================================================== */

    .chat-sender-name {

      margin: 0 0 4px 0;

      font-size: 11px;

      font-weight: 700;

      line-height: 1.2;

      opacity: 0.85;
    }


    /* =====================================================
       MESSAGE TEXT
    ===================================================== */

    .chat-message-text {

      margin: 0;

      font-size: 15px;

      line-height: 1.45;

      white-space: pre-wrap;

      word-break: break-word;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       SYSTEM MESSAGE
    ===================================================== */

    .chat-system-message {

      width: 100%;

      display: flex;

      justify-content: center;

      margin: 14px 0;

      flex-shrink: 0;
    }


    .chat-system-message > div {

      background:
        rgba(20, 184, 166, 0.10);

      color: #0f766e;

      padding: 10px 20px;

      border-radius: 999px;

      text-align: center;
    }


    .chat-system-message .system-subtitle {

      color: #64748b;

      margin-top: 4px;
    }


    /* =====================================================
       SCROLLBAR
    ===================================================== */

    #chatMessages::-webkit-scrollbar {

      width: 5px;
    }


    #chatMessages::-webkit-scrollbar-track {

      background: transparent;
    }


    #chatMessages::-webkit-scrollbar-thumb {

      background:
        rgba(20, 184, 166, 0.25);

      border-radius: 999px;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 640px) {

      #chatMessages {

        padding:
          20px
          12px;
      }


      .chat-bubble {

        max-width: 82%;
      }


      .chat-message-text {

        font-size: 14px;
      }

    }

  </style>

</head>


<body
  class="
    bg-background
    text-on-background
    font-body-md
    min-h-screen
    flex
    flex-col
    antialiased
  "
>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header
    class="
      bg-surface/80
      backdrop-blur-xl
      border-b
      border-white/15
      shadow-sm
      sticky
      top-0
      z-50
      flex
      justify-between
      items-center
      w-full
      px-margin-mobile
      h-16
      flex-shrink-0
    "
  >

    <div class="flex items-center gap-3">

      <!-- BACK BUTTON -->

      <a
        href="index.html"
        aria-label="Back to Ferene"
        class="
          w-10
          h-10
          flex
          items-center
          justify-center
          rounded-full
          bg-surface-container-low
          text-primary
          hover:opacity-80
          active:scale-95
          transition-all
        "
      >

        <span class="material-symbols-outlined">
          arrow_back
        </span>

      </a>


      <!-- ROOM INFORMATION -->

      <div>

        <h1
          id="roomTitle"
          class="
            font-headline-md
            text-[20px]
            text-on-surface
          "
        >
          Travel Group
        </h1>


        <p
          id="connectionStatus"
          class="
            text-text-muted
            text-xs
          "
        >
          Connecting...
        </p>

      </div>

    </div>


    <!-- ===================================================
         GROUP ICON
    ==================================================== -->

    <div
      class="
        w-10
        h-10
        rounded-full
        flex
        items-center
        justify-center
        bg-gradient-to-r
        from-gradient-start
        to-gradient-end
        text-white
      "
    >

      <span class="material-symbols-outlined">
        group
      </span>

    </div>

  </header>


  <!-- =====================================================
       CHAT AREA
  ====================================================== -->

  <main
    id="chatMessages"
    class="flex-1"
  >

    <!-- =================================================
         WELCOME MESSAGE
    ================================================== -->

    <div class="chat-system-message">

      <div>

        <p class="font-label-md">
          🎉 Welcome to the travel group!
        </p>

        <p class="system-subtitle text-sm">
          Start discussing your trip.
        </p>

      </div>

    </div>

  </main>


  <!-- =====================================================
       MESSAGE INPUT
  ====================================================== -->

  <div
    class="
      sticky
      bottom-0
      bg-surface
      border-t
      border-surface-container
      p-4
      flex-shrink-0
    "
  >

    <div
      class="
        max-w-[700px]
        mx-auto
        flex
        gap-3
        items-center
        w-full
      "
    >

      <!-- MESSAGE INPUT -->

      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        class="
          flex-1
          bg-surface-container-low
          rounded-full
          px-5
          py-4
          outline-none
          text-on-surface
          border
          border-transparent
          focus:border-primary/40
          transition-colors
        "
        autocomplete="off"
      />


      <!-- SEND BUTTON -->

      <button
        id="sendButton"
        type="button"
        aria-label="Send message"
        class="
          w-14
          h-14
          flex-shrink-0
          rounded-full
          bg-gradient-to-r
          from-gradient-start
          to-gradient-end
          text-white
          flex
          items-center
          justify-center
          active:scale-95
          hover:opacity-90
          transition-all
          shadow-md
        "
      >

        <span class="material-symbols-outlined">
          send
        </span>

      </button>

    </div>

  </div>


  <!-- =====================================================
       CHAT JAVASCRIPT
       (cache-busted so the corrected chatroom.js is
       guaranteed to load instead of an old cached copy)
  ====================================================== -->

  <script src="chatroom.js?v=3"></script>

</body>

</html>
