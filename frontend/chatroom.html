<!DOCTYPE html>

<html class="light" lang="en">

<head>

<meta charset="UTF-8">


<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>


<title>Ferene · Group Chat</title>


<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>


<script src="tailwind.config.js"></script>


<link
href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>


<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
rel="stylesheet"
/>


<link
href="style.css"
rel="stylesheet"
/>


<!-- SOCKET.IO CLIENT -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


</head>


<body
class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased"
>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->

<header
class="bg-surface/80 backdrop-blur-xl border-b border-white/15 shadow-sm sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile h-16"
>


<div class="flex items-center gap-3">


<a

href="index.html"

class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:opacity-80 transition-all"

>


<span class="material-symbols-outlined">

arrow_back

</span>


</a>


<div>


<h1

id="roomTitle"

class="font-headline-md text-[20px] text-on-surface"

>

Travel Group

</h1>


<p

id="connectionStatus"

class="text-text-muted text-xs"

>

Connecting...

</p>


</div>


</div>



<div
class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-r from-gradient-start to-gradient-end text-white"
>


<span class="material-symbols-outlined">

group

</span>


</div>


</header>



<!-- ========================================= -->
<!-- CHAT AREA -->
<!-- ========================================= -->

<main

id="chatMessages"

class="flex-1 max-w-[700px] w-full mx-auto px-4 py-6 overflow-y-auto"

>


<!-- WELCOME MESSAGE -->

<div class="flex justify-center mb-6">


<div
class="bg-primary-container/10 text-primary px-6 py-4 rounded-full text-center"
>


<p class="font-label-md">

🎉 Welcome to the travel group!

</p>


<p class="text-sm text-text-muted mt-1">

Start discussing your trip.

</p>


</div>


</div>


</main>



<!-- ========================================= -->
<!-- MESSAGE INPUT -->
<!-- ========================================= -->

<div
class="sticky bottom-0 bg-surface border-t border-surface-container p-4"
>


<div
class="max-w-[700px] mx-auto flex gap-3 items-center"
>


<input

id="messageInput"

type="text"

placeholder="Type your message..."

class="flex-1 bg-surface-container-low rounded-full px-5 py-4 outline-none text-on-surface"

autocomplete="off"

/>



<button

id="sendButton"

type="button"

class="w-14 h-14 rounded-full bg-gradient-to-r from-gradient-start to-gradient-end text-white flex items-center justify-center active:scale-95 transition-all"

>


<span class="material-symbols-outlined">

send

</span>


</button>


</div>


</div>



<!-- CHAT JAVASCRIPT -->

<script src="chatroom.js"></script>


</body>


</html>
