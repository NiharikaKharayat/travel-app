<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Ferene · Find your travel tribe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container pb-[96px]">
<header class="bg-surface/80 backdrop-blur-xl border-b border-white/15 shadow-sm sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile h-16">
  <div class="flex items-center gap-3">
    
    <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-container">
      <img alt="Your avatar" class="w-full h-full object-cover" src="https://i.pravatar.cc/100?img=68"/>
    </div>
    <h1 class="font-display-lg text-[24px] bg-clip-text text-transparent bg-gradient-to-r from-gradient-start to-gradient-end">Ferene</h1>
  </div>
  <button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:opacity-80 active:scale-95 transition-all">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
  </button>
</header>
<main class="flex-1 flex flex-col max-w-[560px] w-full mx-auto relative">
<section id="view-home" class="flex-col px-margin-mobile py-6 gap-8">
    <div>
      <h2 class="font-headline-lg-mobile text-on-surface mb-2">Where to next, explorer?</h2>
      <p class="font-body-md text-text-muted max-w-md">Let's craft your perfect journey. Tell us your vision, and we'll connect you with the right people and places.</p>
    </div>

    <div class="bg-surface-card rounded-lg soft-shadow p-gutter flex flex-col gap-5">
      <div>
        <label class="font-label-md text-on-surface-variant block mb-2">Destination</label>
        <div class="flex items-center gap-2 bg-surface-container-low rounded-full px-4 py-3 border border-transparent focus-within:border-primary/50 transition-colors">
          <span class="material-symbols-outlined text-text-muted text-[20px]">location_on</span>
          <input id="destinationInput" type="text" placeholder="City, Country, or Region" class="w-full bg-transparent font-body-md placeholder:text-text-muted"/>
          <button type="button" id="useLocationBtn" onclick="useMyLocation()" class="flex-shrink-0 flex items-center gap-1 text-primary text-xs font-label-md px-2 py-1 rounded-full hover:bg-primary-container/10 transition-colors">
            <span class="material-symbols-outlined text-[16px]">my_location</span> Use my location
          </button>
        </div>
        <p id="locationStatus" class="text-text-muted text-xs mt-1.5 px-2 hidden"></p>
      </div>
      <div>
        <label class="font-label-md text-on-surface-variant block mb-2">When are you going?</label>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 bg-surface-container-low rounded-full px-4 py-3 w-full">
            <span class="material-symbols-outlined text-text-muted text-[20px]">calendar_month</span>
            <input id="startDate" type="date" class="w-full bg-transparent font-body-md text-on-surface"/>
          </div>
          <span class="text-text-muted text-sm flex-shrink-0">to</span>
          <div class="flex items-center gap-2 bg-surface-container-low rounded-full px-4 py-3 w-full">
            <input id="endDate" type="date" class="w-full bg-transparent font-body-md text-on-surface"/>
          </div>
        </div>
      </div>
      <div>
        <label class="font-label-md text-on-surface-variant block mb-2">Budget style</label>
        <div class="flex items-center gap-2 bg-surface-container-low rounded-full px-4 py-3">
          <span class="material-symbols-outlined text-text-muted text-[20px]">payments</span>
          <select class="w-full bg-transparent font-body-md text-text-muted">
            <option>Select budget level</option>
            <option>Budget (under ₹10,000)</option>
            <option>Comfort (₹10,000 – ₹25,000)</option>
            <option>Premium (₹25,000+)</option>
          </select>
        </div>
      </div>
      <div>
        <label class="font-label-md text-on-surface-variant block mb-2">Travel interests</label>
        <div class="flex items-center gap-2 bg-surface-container-low rounded-full px-4 py-3">
          <span class="material-symbols-outlined text-text-muted text-[20px]">interests</span>
          <input type="text" placeholder="e.g. Hiking, Food, Culture" class="w-full bg-transparent font-body-md placeholder:text-text-muted"/>
        </div>
      </div>
      <button onclick="location.href='swipe.html'" class="w-full py-4 rounded-full bg-gradient-to-r from-gradient-start to-gradient-end text-white font-label-md turquoise-glow hover:opacity-90 active:scale-[.98] transition-all">
        Find Travel Buddies
      </button>
    </div>

    <div>
      <h3 class="font-headline-md text-on-surface mb-4">Explore tools</h3>
      <div class="flex flex-col gap-3">
        <button onclick="location.href='swipe.html'" class="bg-surface-card rounded-lg soft-shadow p-5 flex items-center gap-4 text-left hover:-translate-y-0.5 active:scale-[.99] transition-all">
          <div class="w-11 h-11 rounded-full bg-primary-container/10 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-primary">group_add</span>
          </div>
          <div>
            <p class="font-headline-md text-[16px] text-on-surface">Find buddies</p>
            <p class="font-body-md text-text-muted text-sm">Connect with like-minded travelers heading your way.</p>
          </div>
        </button>
        <button onclick="location.href='planner.html'" class="bg-surface-card rounded-lg soft-shadow p-5 flex items-center gap-4 text-left hover:-translate-y-0.5 active:scale-[.99] transition-all">
          <div class="w-11 h-11 rounded-full bg-primary-container/10 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
          </div>
          <div>
            <p class="font-headline-md text-[16px] text-on-surface">AI trip planner</p>
            <p class="font-body-md text-text-muted text-sm">Generate a personalized itinerary in seconds.</p>
          </div>
        </button>
        <button onclick="location.href='gems.html'" class="bg-surface-card rounded-lg soft-shadow p-5 flex items-center gap-4 text-left hover:-translate-y-0.5 active:scale-[.99] transition-all">
          <div class="w-11 h-11 rounded-full bg-primary-container/10 flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-primary">diamond</span>
          </div>
          <div>
            <p class="font-headline-md text-[16px] text-on-surface">Hidden gems</p>
            <p class="font-body-md text-text-muted text-sm">Discover off-the-beaten-path locations.</p>
          </div>
        </button>
      </div>
    </div>
  </section>
</main>
<nav class="bg-surface/80 backdrop-blur-xl border-t border-white/15 shadow-[0_-4px_40px_rgba(7,28,54,0.06)] fixed bottom-0 w-full z-40 flex justify-around items-center h-20 px-4">
  <a href="index.html" class="nav-item flex flex-col items-center justify-center w-full h-full transition-colors active:scale-90 text-primary">
    <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">travel_explore</span>
    <span class="font-label-sm text-label-sm font-bold">Match</span>
  </a>
  <a href="planner.html" class="nav-item flex flex-col items-center justify-center w-full h-full transition-colors active:scale-90 text-on-secondary-fixed-variant">
    <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
    <span class="font-label-sm text-label-sm ">AI planner</span>
  </a>
  <a href="gems.html" class="nav-item flex flex-col items-center justify-center w-full h-full transition-colors active:scale-90 text-on-secondary-fixed-variant">
    <span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">diamond</span>
    <span class="font-label-sm text-label-sm ">Hidden gems</span>
  </a>
</nav>
<script src="home.js" defer></script>
</body>
</html>
